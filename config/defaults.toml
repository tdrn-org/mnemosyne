[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./mnemosyne.log"
file_size_limit = 0
syslog_network = "tcp"
syslog_address = "localhost:601"
syslog_encoding = "rfc5424"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0

[vectordb]
address = "localhost:6334"
tls = false
api_key = ""
tenant = "mnemosyne"
skip_compatibility_check = false
reset = false

[provider]
name = "demo"

[provider.demo]
embedding_dimension = 768

[provider.ollama_cloud]
base_url = "https://ollama.com"
api_key = ""
embedding_model = "qwen3-embedding:0.6b"
embedding_dimension = 1024

[provider.ollama]
base_url = "http://localhost:11434"
api_key = ""
embedding_model = "embeddinggemma"
embedding_dimension = 768

[memory]

[[memory.type]]
name = "fact"
ttl = "2160h"
description = "Objective facts: dates, numbers, technical details."

[[memory.type]]
name = "decision"
ttl = "4320h"
description = "Architecture and design decisions with long-term impact."

[[memory.type]]
name = "session_summary"
ttl = "720h"
description = "Compressed session summaries generated by the agent."

[[memory.type]]
name = "emotional"
ttl = "0h"
description = "Emotional moments that define the relationship. Never expires."

[[memory.type]]
name = "context"
ttl = "168h"
description = "Short-lived working context. Auto-expires when stale."
